services:
    nginx:
        image: nginx:1.27-alpine
        container_name: md-editor-nginx
        restart: unless-stopped
        ports:
            - "${NGINX_HTTP_PORT:-80}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/ssl:/etc/nginx/ssl:ro
            - app-public:/var/www/html/public:ro
        depends_on:
            app:
                condition: service_healthy
        networks:
            - frontend
            - backend
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Dumphere}
                VITE_YJS_WS_HOST: ${VITE_YJS_WS_HOST:-localhost}
                VITE_YJS_WS_PORT: ${VITE_YJS_WS_PORT:-1234}
                VITE_YJS_WS_SCHEME: ${VITE_YJS_WS_SCHEME:-ws}
                VITE_YJS_WS_PATH: ${VITE_YJS_WS_PATH:-}
        container_name: md-editor-app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - CONTAINER_ROLE=app
        volumes:
            - app-public:/var/www/html/public
            - app-storage:/var/www/html/storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php -r 'echo \"ok\";' || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        networks:
            - backend
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "5"

    queue:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Dumphere}
                VITE_YJS_WS_HOST: ${VITE_YJS_WS_HOST:-localhost}
                VITE_YJS_WS_PORT: ${VITE_YJS_WS_PORT:-1234}
                VITE_YJS_WS_SCHEME: ${VITE_YJS_WS_SCHEME:-ws}
                VITE_YJS_WS_PATH: ${VITE_YJS_WS_PATH:-}
        container_name: md-editor-queue
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - CONTAINER_ROLE=queue
        command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
        volumes:
            - app-storage:/var/www/html/storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - backend
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Dumphere}
                VITE_YJS_WS_HOST: ${VITE_YJS_WS_HOST:-localhost}
                VITE_YJS_WS_PORT: ${VITE_YJS_WS_PORT:-1234}
                VITE_YJS_WS_SCHEME: ${VITE_YJS_WS_SCHEME:-ws}
                VITE_YJS_WS_PATH: ${VITE_YJS_WS_PATH:-}
        container_name: md-editor-scheduler
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - CONTAINER_ROLE=scheduler
        command: ["php", "artisan", "schedule:work"]
        volumes:
            - app-storage:/var/www/html/storage
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - backend
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "3"

    postgres:
        image: postgres:17-alpine
        container_name: md-editor-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    redis:
        image: redis:7-alpine
        container_name: md-editor-redis
        restart: unless-stopped
        command: >
            redis-server
            --appendonly yes
            --maxmemory 256mb
            --maxmemory-policy allkeys-lru
            --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "3"

    yjs-websocket:
        build:
            context: ./yjs-server
            dockerfile: Dockerfile
        container_name: md-editor-yjs-ws
        restart: unless-stopped
        environment:
            HOST: "0.0.0.0"
            PORT: "1234"
            YJS_WS_SECRET: ${YJS_WS_SECRET:-${APP_KEY}}
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1234"]
            interval: 15s
            timeout: 5s
            retries: 3
        logging:
            driver: "json-file"
            options:
                max-size: "5m"
                max-file: "3"
        networks:
            - backend

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    app-public:
        driver: local
    app-storage:
        driver: local

networks:
    frontend:
        driver: bridge
    backend:
        driver: bridge
        internal: true

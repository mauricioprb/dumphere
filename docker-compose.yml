name: md-online-editor

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-md_editor}
      POSTGRES_USER: ${DB_USERNAME:-md_editor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres18_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-md_editor} -d ${DB_DATABASE:-md_editor}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: md-editor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-md_editor}
      POSTGRES_USER: ${DB_USERNAME:-md_editor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-md_editor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: md-editor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  yjs-websocket:
    build:
      context: ./yjs-server
      dockerfile: Dockerfile
    container_name: md-editor-yjs-ws
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "1234"
      YJS_WS_SECRET: ${YJS_WS_SECRET:-${APP_KEY}}
    ports:
      - "1234:1234"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:1234",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

version: 2
updates:
  - package-ecosystem: composer
    directories: [/functions/documents, /functions/admin]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories: [/sites/app, /yjs-server]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

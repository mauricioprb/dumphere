name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, pcntl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Audit production dependencies
        run: composer audit --locked --no-dev

      - name: Pint (code style)
        run: composer lint:test

      - name: Run tests
        run: composer test

  frontend:
    name: Frontend Build & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (code quality)
        run: npm run lint:test

      - name: Prettier (code style)
        run: npm run format:test

      - name: TypeScript check
        run: ./node_modules/.bin/vue-tsc --noEmit

      - name: Frontend unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  collaboration:
    name: Collaboration server Tests & Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: yjs-server

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yjs-server/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  services:
    name: Compose Dependencies
    runs-on: ubuntu-latest
    needs: [php, frontend, collaboration]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Start dependencies
        run: docker compose up -d --wait

      - name: Verify PostgreSQL
        run: docker compose exec -T postgres postgres --version

      - name: Stop dependencies
        if: always()
        run: docker compose down --volumes

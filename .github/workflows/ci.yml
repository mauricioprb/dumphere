name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [documents, admin]
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer check-platform-reqs
      - run: composer lint
      - if: matrix.function == 'documents'
        run: composer test

  shared-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regras copiadas entre as Functions continuam iguais
        run: |
          diff functions/documents/src/DocumentSlug.php functions/admin/src/DocumentSlug.php
          diff functions/documents/src/RecoveryKey.php functions/admin/src/RecoveryKey.php

  collaboration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yjs-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: sites/app/.nvmrc
          cache: npm
          cache-dependency-path: yjs-server/package-lock.json
      - run: npm ci
      - run: npm test

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: sites/app/.nvmrc
          cache: npm
          cache-dependency-path: sites/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate
      - run: npm run check:csp

  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [functions, shared-rules, collaboration, site]
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.event_name == 'workflow_dispatch' && 'dev' || 'prod' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && 'dev' || 'prod' }}
      APPWRITE_ENDPOINT: https://overmaker.overclk.tech/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: sites/app/.nvmrc
      - run: npm install --global appwrite-cli@28.9.0

      - name: Projeto
        env:
          KEY_DEV: ${{ secrets.APPWRITE_API_KEY_DEV }}
          KEY_PROD: ${{ secrets.APPWRITE_API_KEY_PROD }}
          SITE_URL: ${{ vars.SITE_URL }}
          YJS_URL_DEV: ${{ vars.YJS_URL_DEV }}
          YJS_URL_PROD: ${{ vars.YJS_URL_PROD }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          dev=$(jq -r .projectId appwrite.config.json)
          case "$dev" in
            *-dev) ;;
            *) echo "::error::O projectId do appwrite.config.json ('$dev') precisa terminar em -dev."; exit 1 ;;
          esac
          if [ "$TARGET" = prod ]; then
            project="${dev%-dev}-prod" key="$KEY_PROD" site="$SITE_URL" yjs="$YJS_URL_PROD"
          else
            project="$dev" key="$KEY_DEV" site="https://$dev.app.overclk.tech" yjs="$YJS_URL_DEV"
          fi
          if [ -z "$key" ] || [ -z "$site" ] || [ -z "$yjs" ]; then
            echo "::error::Falta o segredo APPWRITE_API_KEY_${TARGET^^} ou as variáveis SITE_URL e YJS_URL_${TARGET^^} no repositório."
            exit 1
          fi
          jq --arg id "$project" '.projectId = $id' appwrite.config.json > appwrite.deploy.json
          mv appwrite.deploy.json appwrite.config.json
          appwrite client --endpoint "$APPWRITE_ENDPOINT" --key "$key"
          {
            echo "PROJECT=$project"
            echo "SITE=$site"
            echo "YJS=$yjs"
            echo "CONTACT=$CONTACT_EMAIL"
          } >> "$GITHUB_ENV"
          echo "Publicando $GITHUB_REF_NAME em $project ($site)"

      - name: Esquema
        run: appwrite push table --all --force

      - name: Functions
        run: appwrite push function --all --activate --force

      - name: Site
        run: |
          printf 'NUXT_PUBLIC_APPWRITE_ENDPOINT=%s\nNUXT_PUBLIC_APPWRITE_PROJECT_ID=%s\nNUXT_PUBLIC_YJS_URL=%s\nNUXT_PUBLIC_CONTACT_EMAIL=%s\n' \
            "$APPWRITE_ENDPOINT" "$PROJECT" "$YJS" "$CONTACT" > sites/app/.env
          appwrite push site --all --activate --with-variables --force

      - name: Teste de fumaça
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 10 "$SITE/terms"
          curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 10 "${YJS/wss:/https:}/health"

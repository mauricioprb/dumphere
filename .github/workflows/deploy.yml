name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate immutable action references
        run: bash scripts/check-actions-pinned.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Install Deployer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/dumphere_deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/dumphere_deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy with Deployer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: main
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
          DEPLOY_YJS_SERVICE: ${{ vars.DEPLOY_YJS_SERVICE }}
          DEPLOY_BACKUP_TIMER: ${{ vars.DEPLOY_BACKUP_TIMER }}
          DEPLOY_REMOTE_PATH: ${{ vars.DEPLOY_REMOTE_PATH }}
          DEPLOY_IDENTITY_FILE: ${{ runner.temp }}/dumphere_deploy_key
        run: vendor/bin/dep deploy production --no-interaction

      - name: Remove temporary SSH credentials
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/dumphere_deploy_key"
          rm -f -- "$HOME/.ssh/known_hosts"

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: md-editor
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_YJS_WS_HOST=${{ vars.VITE_YJS_WS_HOST }}
            VITE_YJS_WS_PORT=${{ vars.VITE_YJS_WS_PORT }}
            VITE_YJS_WS_SCHEME=${{ vars.VITE_YJS_WS_SCHEME }}
            VITE_YJS_WS_PATH=${{ vars.VITE_YJS_WS_PATH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}

            git pull origin main

            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u mauricioprb --password-stdin

            docker pull ghcr.io/mauricioprb/md-online-editor:latest
            APP_IMAGE=ghcr.io/mauricioprb/md-online-editor:latest \
              docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            sleep 15

            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize
            docker compose -f docker-compose.prod.yml exec -T app php artisan queue:restart

            docker image prune -f

            curl -sf http://localhost:8081/health || exit 1
